<!-- LOGIKA JAVASCRIPT & DETEKSI (PERBAIKAN) -->
    <script>
        // --- 1. KONFIGURASI SUPABASE ---
        const SUPABASE_URL = "https://YOUR_SUPABASE_URL.supabase.co";
        const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
        
        // PERBAIKAN: Menggunakan nama variabel 'supabaseClient' untuk mencegah error shadowing
        let supabaseClient = null;
        try {
            if (typeof supabase !== 'undefined' && !SUPABASE_URL.includes("YOUR_SUPABASE_URL")) {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        } catch (e) {
            console.warn("Supabase belum dikonfigurasi dengan benar, berjalan dalam mode lokal.", e);
        }

        // --- 2. VARIABEL SISTEM ---
        const SESSION_ID = 101;
        let isExamActive = false;
        let warningCount = 0;
        const MAX_WARNINGS = 3;
        let audioCtx = null;

        // --- 3. AUDIO WEB API (SUARA ALARM) ---
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playWarningSound() {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.3);

            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        }

        // --- 4. PENANGANAN PELANGGARAN ---
        async function triggerViolation(reason) {
            if (!isExamActive || warningCount >= MAX_WARNINGS) return;

            warningCount++;
            playWarningSound();

            // Update Badge di Header
            const badge = document.getElementById('warning-badge');
            if (badge) {
                badge.innerText = `${warningCount} / ${MAX_WARNINGS}`;
                badge.className = warningCount >= 2 ? 'font-bold text-rose-500' : 'font-bold text-amber-400';
            }

            // Kirim Laporan ke Supabase (Hanya jika terhubung)
            if (supabaseClient) {
                try {
                    await supabaseClient.from('violation_logs').insert([{
                        session_id: SESSION_ID,
                        violation_type: 'app_switch',
                        reason: reason
                    }]);

                    await supabaseClient.from('exam_sessions').update({
                        warning_count: warningCount,
                        status: warningCount >= MAX_WARNINGS ? 'locked' : 'ongoing'
                    }).eq('id', SESSION_ID);
                } catch (err) {
                    console.error("Gagal sinkronisasi data ke server:", err);
                }
            }

            // Tampilkan UI Modal Sesuai Jumlah Warning
            if (warningCount >= MAX_WARNINGS) {
                isExamActive = false;
                document.getElementById('exam-frame').src = 'about:blank';
                document.getElementById('locked-modal').classList.remove('hidden');
            } else {
                document.getElementById('modal-reason').innerText = reason;
                document.getElementById('modal-count').innerText = `${warningCount} / ${MAX_WARNINGS}`;
                document.getElementById('warning-modal').classList.remove('hidden');
            }
        }

        // --- 5. DETEKSI PINDAH TAB & IFRAME FOCUS ---

        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "hidden" && isExamActive) {
                triggerViolation("Anda terdeteksi berpindah tab atau mengecilkan browser.");
            }
        });

        window.addEventListener("blur", () => {
            if (!isExamActive) return;

            setTimeout(() => {
                if (document.activeElement && document.activeElement.tagName === "IFRAME") {
                    return; // Klik di dalam Google Form aman
                }
                triggerViolation("Anda terdeteksi membuka atau mengklik aplikasi lain di luar browser.");
            }, 150);
        });

        // --- 6. PEMBLOKIRAN FITUR KECURANGAN ---
        document.addEventListener('contextmenu', e => e.preventDefault());

        document.addEventListener('keydown', e => {
            if (
                e.key === 'F12' ||
                (e.ctrlKey && ['c', 'v', 'u', 'a', 'p'].includes(e.key.toLowerCase())) ||
                (e.ctrlKey && e.shiftKey && ['i', 'j', 'c'].includes(e.key.toLowerCase()))
            ) {
                e.preventDefault();
            }
        });

        // --- 7. EVENT CONTROLLER (TOMBOL UI) ---
        document.addEventListener("DOMContentLoaded", () => {
            // Tombol Mulai Ujian
            const btnStart = document.getElementById('btn-start');
            if (btnStart) {
                btnStart.addEventListener('click', () => {
                    initAudio();
                    isExamActive = true;

                    if (document.documentElement.requestFullscreen) {
                        document.documentElement.requestFullscreen().catch(() => {});
                    }

                    document.getElementById('start-overlay').classList.add('hidden');
                });
            }

            // Tombol Saya Mengerti
            const btnDismiss = document.getElementById('btn-dismiss');
            if (btnDismiss) {
                btnDismiss.addEventListener('click', () => {
                    document.getElementById('warning-modal').classList.add('hidden');
                    
                    if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
                        document.documentElement.requestFullscreen().catch(() => {});
                    }
                });
            }
        });
    </script>
